[package]
name = "sitegen"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "makefun-site 1.0.0's build in Rust, for WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
